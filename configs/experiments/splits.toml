# Dataset splits for the mock lateral-movement scenarios (task 5.1, AD-24).
#
# Scenario files live under configs/scenarios/mock/<scenario_id>.json. The
# episodes of a split are the cross product of its `scenarios` and `seeds`.
#
# Disjointness (asserted by evaluation.splits.assert_disjoint, task 12.1):
#   - the scenario-id sets of train, cal, eval and eval_utopo are pairwise
#     disjoint;
#   - the seed sets of train, cal, eval and eval_utopo are pairwise disjoint;
#   - train and cal never touch the unseen topology: topo-mock-small-v2 is used
#     only by the eval_utopo scenarios, every other split runs on
#     topo-mock-small-v1 (the topology of each split follows from the
#     topology_id of its scenario files).
#
# Nothing on the unseen topology and nothing in eval or eval_utopo is used for
# training, threshold selection or calibration (AD-24, AD-29). The [smoke.*]
# tables are a small subset of train/cal/eval for the end-to-end smoke run and
# deliberately reuse those scenarios and seeds.

[train]
scenarios = [
  "scn-mock-lateral-train-01",
  "scn-mock-lateral-train-02",
  "scn-mock-lateral-train-03",
  "scn-mock-lateral-train-04",
  "scn-mock-lateral-train-05",
  "scn-mock-lateral-train-06",
]
seeds = [
  1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
  1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
]

[cal]
scenarios = [
  "scn-mock-lateral-cal-01",
  "scn-mock-lateral-cal-02",
]
seeds = [1500, 1501, 1502, 1503, 1504, 1505, 1506, 1507, 1508, 1509]

[eval]
scenarios = [
  "scn-mock-lateral-eval-01",
  "scn-mock-lateral-eval-02",
  "scn-mock-lateral-eval-03",
  "scn-mock-lateral-eval-04",
]
seeds = [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]

[eval_utopo]
scenarios = [
  "scn-mock-lateral-utopo-01",
  "scn-mock-lateral-utopo-02",
]
seeds = [2500, 2501, 2502, 2503, 2504, 2505, 2506, 2507, 2508, 2509]

[smoke.train]
scenarios = ["scn-mock-lateral-train-01", "scn-mock-lateral-train-04"]
seeds = [1000, 1001, 1002, 1003]

[smoke.cal]
scenarios = ["scn-mock-lateral-cal-01", "scn-mock-lateral-cal-02"]
seeds = [1500, 1501, 1502, 1503]

[smoke.eval]
scenarios = ["scn-mock-lateral-eval-01", "scn-mock-lateral-eval-02"]
seeds = [2000, 2001]
